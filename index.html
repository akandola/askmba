<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASK MBA Consulting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f0f0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.10), 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 64px 80px;
      text-align: center;
      max-width: 640px;
      width: 90%;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .hero p {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 400;
      color: #555555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>ASK MBA Consulting</h1>
    <p>where your story becomes your strategy</p>
  </div>
</body>
</html>
